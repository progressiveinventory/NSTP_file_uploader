<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Client File Uploader</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .upload-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }

        h2 {
            margin-bottom: 8px;
            font-size: 1.5rem;
            color: #ffffff;
        }

        p.subtitle {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: #cbd5e1;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"], input[type="file"] {
            width: 100%;
            padding: 12px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, input[type="file"]:focus {
            border-color: #3b82f6;
        }

        input[type="file"] {
            padding: 10px;
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        button:hover {
            opacity: 0.9;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background: #475569;
            cursor: not-allowed;
        }

        #status {
            margin-top: 16px;
            text-align: center;
            font-size: 0.9rem;
        }

        .success { color: #4ade80; }
        .error { color: #f87171; }
        .loading { color: #60a5fa; }
    </style>
</head>
<body>

    <div class="upload-card">
        <h2>Client File Portal</h2>
        <p class="subtitle">Upload your pictures, documents, and project assets securely.</p>
        
        <form id="uploadForm">
            <div class="form-group">
                <label for="clientName">Your Name / Company</label>
                <input type="text" id="clientName" required placeholder="Enter your name">
            </div>

            <div class="form-group">
                <label for="fileField">Select File (Images, PDFs, Zips, etc.)</label>
                <input type="file" id="fileField" required>
            </div>

            <button type="submit" id="submitBtn">Upload to Google Drive</button>
        </form>

        <div id="status"></div>
    </div>

    <script>
        // REPLACE WITH YOUR GOOGLE APPS SCRIPT WEB APP URL
        const WEB_APP_URL = "https://script.google.com/macros/library/d/1WoupJ8_HaikEn6s0zf1DRH8p-evO9R3vSl8HJCGZwVdPIVwXK4cbixp_/4";

        const form = document.getElementById('uploadForm');
        const submitBtn = document.getElementById('submitBtn');
        const statusDiv = document.getElementById('status');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const clientName = document.getElementById('clientName').value.trim();
            const fileInput = document.getElementById('fileField');
            const file = fileInput.files[0];

            if (!file) return;

            // Optional: Limit file size check (e.g., max 25MB due to Apps Script limits)
            if (file.size > 25 * 1024 * 1024) {
                statusDiv.className = "error";
                statusDiv.textContent = "File is too large! Max file size is 25MB.";
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = "Uploading...";
            statusDiv.className = "loading";
            statusDiv.textContent = "Processing and sending file to Google Drive...";

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function () {
                const payload = {
                    clientName: clientName,
                    fileName: file.name,
                    mimeType: file.type,
                    fileData: reader.result
                };

                fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors', // Apps Script requires no-cors mode for standard web fetch
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(payload)
                })
                .then(() => {
                    statusDiv.className = "success";
                    statusDiv.textContent = "File uploaded successfully!";
                    form.reset();
                })
                .catch(error => {
                    console.error('Error:', error);
                    statusDiv.className = "error";
                    statusDiv.textContent = "Upload failed. Please try again.";
                })
                .finally(() => {
                    submitBtn.disabled = false;
                    submitBtn.textContent = "Upload to Google Drive";
                });
            };

            reader.onerror = function (error) {
                console.error('Error reading file:', error);
                statusDiv.className = "error";
                statusDiv.textContent = "Error reading file.";
                submitBtn.disabled = false;
                submitBtn.textContent = "Upload to Google Drive";
            };
        });
    </script>
</body>
</html>
